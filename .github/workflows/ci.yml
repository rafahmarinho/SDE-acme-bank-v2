name: ci

on:
  push:
    branches: [main, "security-hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Supply chain: lockfile must match package.json; install scripts are blocked by .npmrc.
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # TLS validation must never be disabled.
      - name: Forbid disabled TLS verification
        run: |
          if grep -rnE "NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*['\"]?0|rejectUnauthorized:\s*false" src scripts supabase; then
            echo "TLS certificate validation must not be disabled"; exit 1
          fi

      # No secrets in the repository or its history.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
          NEXT_PUBLIC_SITE_URL: https://ci.acme-bank.example
